<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one working screen — header band, filter panel, full-width ledger table; preview slides in from the right. Black on white, like a bank statement. */
:root {
  --bg: #F3F3F1; --surface: #FFFFFF; --ink: #111111; --ink-2: #3B3B39; --muted: #5C5C58;
  --line: #D9D9D5; --line-2: #EAEAE6; --field: #B9B9B4; --soft: #ECECE8; --s2: #D3D3CE; --s3: #4A4A47;
  --inv-bg: #111111; --inv-fg: #FFFFFF; --danger: #B42318; --danger-bg: #FDECEA; --danger-ink: #8A1C12;
  --scrim: rgba(17, 17, 17, 0.45); --logo-filter: none;
  --crit: #B42318; --crit-bg: #FDECEA; --imp: #E0A800; --imp-bg: #FFF7D1; --fyi: #067647; --fyi-bg: #E8F6EE;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121211; --surface: #1B1B1A; --ink: #F2F2EF; --ink-2: #D0D0CB; --muted: #A2A29C;
  --line: #34342F; --line-2: #2A2A26; --field: #55554F; --soft: #272724; --s2: #3B3B37; --s3: #BDBDB7;
  --inv-bg: #F2F2EF; --inv-fg: #111111; --danger: #FF8A80; --danger-bg: #3A1714; --danger-ink: #FFB4AB;
  --crit: #FF8A80; --crit-bg: #3A1714; --imp: #F5C518; --imp-bg: #332A08; --fyi: #6CD49A; --fyi-bg: #12301F;
  --scrim: rgba(0, 0, 0, 0.6); --logo-filter: invert(1); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1B1B1A; --ink: #F2F2EF; --ink-2: #D0D0CB; --muted: #A2A29C;
  --line: #34342F; --line-2: #2A2A26; --field: #55554F; --soft: #272724; --s2: #3B3B37; --s3: #BDBDB7;
  --inv-bg: #F2F2EF; --inv-fg: #111111; --danger: #FF8A80; --danger-bg: #3A1714; --danger-ink: #FFB4AB;
  --crit: #FF8A80; --crit-bg: #3A1714; --imp: #F5C518; --imp-bg: #332A08; --fyi: #6CD49A; --fyi-bg: #12301F;
  --scrim: rgba(0, 0, 0, 0.6); --logo-filter: invert(1); color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1440px; margin: 0 auto; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.logo { display: block; filter: var(--logo-filter); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--inv-bg); background: var(--inv-bg); color: var(--inv-fg); font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn.o { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.btn.q { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.d { background: var(--danger); border-color: var(--danger); color: #FFFFFF; }
.btn.do { background: var(--surface); border-color: var(--danger); color: var(--danger); }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 13px; }
.btn.done { background: var(--soft); border-color: var(--soft); color: var(--ink); cursor: default; }
.btn:disabled { background: transparent; border-color: var(--line); color: var(--muted); cursor: not-allowed; }
.icon { width: 44px; height: 44px; padding: 0; border: 0; background: transparent; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
.link { background: none; border: 0; padding: 0 4px; min-height: 44px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--ink); }

.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 13px; font-weight: 500; }
.fld.wide { grid-column: 1 / -1; }
.fld .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
.req { color: var(--danger); font-weight: 500; }
.inp { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--field); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 400; font-size: 14px; }
textarea.inp { resize: vertical; }
input[type="date"].inp { min-width: 0; max-width: 100%; display: block; }
/* iPhone/iPad Safari: date fields keep a built-in minimum width unless the native look is turned off */
@supports (-webkit-touch-callout: none) {
  input[type="date"].inp { -webkit-appearance: none; appearance: none; width: 100%; min-height: 44px; line-height: 24px; }
  input[type="date"].inp::-webkit-date-and-time-value { text-align: left; min-height: 24px; }
}
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--field); background: var(--surface); cursor: pointer; }
.seg.on { border: 1.5px solid var(--ink); background: var(--soft); font-weight: 600; }
.seg input { accent-color: var(--ink); }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--field); background: var(--surface); cursor: pointer; font-size: 13px; }
.chip.on { background: var(--inv-bg); border-color: var(--inv-bg); color: var(--inv-fg); font-weight: 600; }
.alert { padding: 10px 14px; border-radius: 10px; font-size: 13px; }
.alert.e { background: var(--danger-bg); color: var(--danger-ink); }
.alert.i { background: var(--soft); color: var(--ink); }
.ann { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; border-left: 5px solid var(--lc); background: var(--lb); color: var(--ink); }
.ann.critical { --lc: var(--crit); --lb: var(--crit-bg); } .ann.important { --lc: var(--imp); --lb: var(--imp-bg); } .ann.fyi { --lc: var(--fyi); --lb: var(--fyi-bg); }
.lvl { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; color: var(--surface); background: var(--lc); white-space: nowrap; }
.lvl.critical { --lc: var(--crit); } .lvl.important { --lc: var(--imp); color: #111; } .lvl.fyi { --lc: var(--fyi); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.pad { padding: 16px 20px; }
.ck { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }

.badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.s0 { border-color: var(--ink); color: var(--ink); }
.s1 { background: var(--soft); }
.s2 { background: var(--s2); }
.s3 { background: var(--s3); color: var(--bg); }
.s4 { background: var(--inv-bg); color: var(--inv-fg); }
.s5 { border: 1px dashed var(--danger); color: var(--danger); }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { display: block; font-size: 16px; }
.brand small { display: block; font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; flex-grow: 1; }
.tab { min-height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-weight: 600; cursor: pointer; }
.tab.on { background: var(--inv-bg); color: var(--inv-fg); }
.pill { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 999px; background: var(--inv-bg); color: var(--inv-fg); font-size: 11px; line-height: 18px; text-align: center; }
.tab.on .pill { background: var(--inv-fg); color: var(--inv-bg); }
.pop { position: absolute; right: 0; top: 52px; width: 360px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16); overflow: hidden; z-index: 20; }
.dot { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--inv-bg); color: var(--inv-fg); border: 2px solid var(--surface); font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; }
.av { width: 34px; height: 34px; border-radius: 999px; background: var(--inv-bg); color: var(--inv-fg); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: 0 0 auto; }
.av.l { background: var(--soft); color: var(--ink); }
.acct { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
.acct span.t { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; text-align: left; }

main.page { padding-block: 24px; display: flex; flex-direction: column; gap: 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 26px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 13px; }
.bulk { background: var(--inv-bg); color: var(--inv-fg); border-radius: 12px; padding: 10px 12px 10px 20px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.bulk .btn { background: var(--inv-fg); color: var(--inv-bg); border-color: var(--inv-fg); }
.bulk .btn.ol { background: transparent; color: var(--inv-fg); border-color: var(--inv-fg); }
.bulk .btn.rm { background: transparent; color: var(--inv-fg); border-color: var(--danger); }
.bulk .btn:disabled { background: transparent; color: var(--muted); border-color: var(--muted); }
.scroll { overflow-x: auto; position: relative; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink); background: var(--bg); padding: 4px 12px; white-space: nowrap; }
table.t td { padding: 10px 12px; border-top: 1px solid var(--line-2); vertical-align: middle; }
table.t tr.sel td { background: var(--soft); }
table.t .r { text-align: right; }
.sortb { all: unset; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; cursor: pointer; }
.sortb:focus-visible { outline: 2px solid var(--ink); }
.ar { font-size: 10px; color: var(--muted); }
.ar.on { color: var(--ink); }
.namebtn { all: unset; display: flex; flex-direction: column; min-height: 44px; justify-content: center; cursor: pointer; }
.namebtn b { text-decoration: underline; text-underline-offset: 3px; }
.namebtn:focus-visible { outline: 2px solid var(--ink); }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: flex; }
.drawer { margin-left: auto; width: 100%; max-width: 720px; height: 100%; background: var(--bg); overflow-y: auto; box-shadow: -12px 0 40px rgba(0, 0, 0, 0.2); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dhead { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 12px 24px; display: flex; gap: 12px; align-items: center; }
.dbody { padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-weight: 600; font-size: 15px; }
.kpi.inv { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.kpi.inv .k { color: inherit; opacity: 0.75; }
.kpi.inv .v { font-size: 18px; font-weight: 700; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; font-size: 12px; }
.steps li { display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.steps li i { display: block; height: 4px; border-radius: 2px; background: var(--line); }
.steps li.done i { background: var(--ink); }
.steps li.cur { color: var(--ink); font-weight: 600; }
dl.kv { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 24px; }
dl.kv dt { font-size: 12px; color: var(--muted); }
dl.kv dd { margin: 2px 0 0; font-weight: 500; white-space: pre-line; word-break: break-word; }

.modal-wrap { position: fixed; inset: 0; z-index: 40; background: var(--scrim); overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: 100%; max-width: 680px; margin: 0 auto; background: var(--surface); border-radius: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25); }
.mhead { display: flex; align-items: center; gap: 12px; padding: 18px 16px 14px 24px; border-bottom: 1px solid var(--line-2); }
.mbody { padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }
.mfoot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 14px 24px 20px; border-top: 1px solid var(--line-2); }
.choice { all: unset; display: flex; gap: 14px; align-items: flex-start; padding: 16px; border: 1px solid var(--field); border-radius: 12px; cursor: pointer; }
.choice:hover { border-color: var(--ink); }
.choice:focus-visible { outline: 2px solid var(--ink); }
.drop { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 20px; border: 1.5px dashed var(--field); border-radius: 12px; text-align: center; cursor: pointer; }
.drop.over { border-color: var(--ink); background: var(--soft); }
.filebox { padding: 10px 6px 10px 12px; background: var(--bg); border-radius: 8px; display: flex; gap: 10px; align-items: flex-start; }
.subcard { margin-top: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: min(560px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 10px; background: var(--inv-bg); color: var(--inv-fg); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); font-size: 14px; }
.toast.e { background: var(--danger); color: #FFFFFF; }

.auth { min-height: 100%; display: flex; align-items: center; justify-content: center; padding-block: 40px; }
.auth .box { width: 100%; max-width: 440px; padding: 30px 28px; display: flex; flex-direction: column; gap: 18px; }
.alpha { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--ink); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide 0.18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: 0.6; } } }
.stepnow { display: none; font-size: 13px; }
.burger { display: none; border: 1px solid var(--line); }
.navscrim { z-index: 45; }
.navsheet { margin-left: auto; width: min(320px, 86vw); height: 100%; overflow-y: auto; background: var(--surface); box-shadow: -12px 0 40px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; gap: 16px; padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) 16px; }
.navitem { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; color: var(--ink); }
.navitem:hover { background: var(--soft); }
.navitem:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.navitem.on { background: var(--inv-bg); color: var(--inv-fg); }
.navitem.sub { min-height: 44px; font-size: 15px; font-weight: 500; }
.navitem.on .pill { background: var(--inv-fg); color: var(--inv-bg); }
@media (prefers-reduced-motion: no-preference) { .navsheet { animation: slide 0.18s ease-out; } }
.addbtn .lbl { display: inline; }
/* Phone list (cards) — used below 900px instead of the wide table */
.mlist { display: flex; flex-direction: column; gap: 10px; }
.mbar { display: flex; align-items: center; gap: 8px; }
.mbar select { min-width: 0; max-width: 46vw; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mcard.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.mtop { display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; }
.ckwrap { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -6px 0 -6px -12px; flex: 0 0 auto; cursor: pointer; }
.mcard .namebtn { min-height: 40px; }
.mcard .namebtn b { font-size: 15px; word-break: break-word; }
.mmeta { font-size: 13px; color: var(--ink-2); word-break: break-word; }
.mcf { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.mcf .amt { margin-left: auto; font-size: 16px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.mcf .icon { margin-right: -10px; }

@media (max-width: 900px) {
  header.top .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "brand bell burger"; gap: 8px; padding-block: 8px; }
  nav.tabs, .addbtn, .acctw { display: none !important; }
  .burger { display: inline-flex; grid-area: burger; }
  .brand { grid-area: brand; min-width: 0; }
  .brand small { display: none; }
  .brand > div { min-width: 0; }
  .brand b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bellw { grid-area: bell; }
  .acctw { grid-area: acct; }
  nav.tabs { grid-area: tabs; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 8px; }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; min-height: 40px; padding: 0 12px; flex: 0 0 auto; }
  .acct { padding: 0 4px; }
  .acct span.t { display: none; }
  .pop { position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; max-width: none; }
  .addbtn { grid-area: add; width: 44px; height: 44px; min-height: 44px; padding: 0; }
  .addbtn .lbl { display: none; }
  main.page { padding-block: 14px calc(88px + env(safe-area-inset-bottom, 0px)); gap: 12px; }
  .pad { padding: 14px 16px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .chip { flex: 0 0 auto; }
  .chips .lab { display: none; }
  .fgrid { grid-template-columns: 1fr 1fr !important; }

var LEVELS = [['critical', 'Critical'], ['important', 'Important'], ['fyi', 'FYI']];

function SetPassword() {

    ${f.done ? html`<div class="alert i" role="status">Your password is set. Sign in with it now${invite ? '; the Help center in the menu shows you around' : ''}.</div><button class="btn" onClick=${leave}>Go to sign in</button>`

        <${Field} label="New password" req hint="At least 8 characters"><input id="sp-pass" class="inp" type="password" autocomplete="new-password" value=${f.pass} onInput=${inputOn(f, set, 'pass')} /><//>

// ---------- manual-entry draft
function blankDraft(g) {
  g = g || {};

}
function draftOk(dr) { return !!dr && !!dr.name.trim() && parseNum(dr.amount) > 0; }
function draftFields(dr) {
  return { name: dr.name.trim(), pib: dr.pib.trim(), address: dr.address.trim(), account: (dr.account || '').trim(), number: dr.number.trim(), iso: dr.date || '', date: isoToDate(dr.date), amount: parseNum(dr.amount),

}

  var itf = function (i, k) { return function (e) { var its = dr.items.slice(); its[i] = Object.assign({}, its[i]); its[i][k] = e.target.value; set(Object.assign({}, dr, { items: its })); }; };
  var match = benByPib(dr.pib.trim());

    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px">
      <${Field} label="Supplier / beneficiary name" req><input id=${id + '-name'} class="inp" value=${dr.name} onInput=${f('name')} /><//>
      <${Field} label="PIB"><input id=${id + '-pib'} class="inp" inputmode="numeric" value=${dr.pib} onInput=${f('pib')} /><//>
      <${Field} label="Bank account" hint=${acctHint(dr.account || '', '')}><input onBlur=${function (e) { if (acctOk(e.target.value)) set(Object.assign({}, dr, { account: acctNorm(e.target.value) })); }} id=${id + '-acct'} class="inp mono" inputmode="numeric" placeholder="510-0000000000000-00" value=${dr.account || ''} onInput=${f('account')} /><//>
      <${Field} label="Invoice no."><input id=${id + '-no'} class="inp" value=${dr.number} onInput=${f('number')} /><//>
      <${Field} label="Date"><input id=${id + '-date'} class="inp" type="date" value=${dr.date} onInput=${f('date')} /><//>
      <${Field} label="Amount (EUR)" req><input id=${id + '-amt'} class="inp num" inputmode="decimal" placeholder="0,00" value=${dr.amount} onInput=${f('amount')} /><//>
      <${Field} label="Address" wide><input id=${id + '-adr'} class="inp" value=${dr.address} onInput=${f('address')} /><//>
    </div>
    ${match && html`<div style="font-size: 12px">In the beneficiary archive: <b>${match.name}</b></div>`}
    <b style="font-size: 12px">Items</b>
    ${dr.items.map(function (it, i) { return html`<div key=${i} class="row" style="align-items: flex-end; gap: 6px">
      <label class="fld" style="flex: 3 1 160px"><span>Item ${i + 1}</span><input id=${id + '-it' + i} class="inp" value=${it.name} onInput=${itf(i, 'name')} /></label>
      <label class="fld" style="flex: 1 1 60px"><span>Qty</span><input class="inp num" inputmode="decimal" value=${it.qty} onInput=${itf(i, 'qty')} /></label>
      <label class="fld" style="flex: 1 1 100px"><span>Total (EUR)</span><input class="inp num" inputmode="decimal" value=${it.total} onInput=${itf(i, 'total')} /></label>
      <button class="icon" style="border: 1px solid var(--line)" aria-label=${'Remove item ' + (i + 1)} onClick=${function () { var its = dr.items.filter(function (_, j) { return j !== i; }); set(Object.assign({}, dr, { items: its.length ? its : [{ name: '', qty: '', total: '' }] })); }}>${I.x}</button>
    </div>`; })}
    <button class="btn o sm" style="align-self: flex-start" onClick=${function () { set(Object.assign({}, dr, { items: dr.items.concat([{ name: '', qty: '', total: '' }]) })); }}>+ Add item</button>

// ================= ADD TO QUEUE =================
function blankForm() { return { beneficiary: '', benId: '', saveBen: true, payType: 'domestic', account: '', iban: '', swift: '', reason: '', purpose: '', amount: '', jmbg: '', payRef: '', legalRef: '', legalAuto: false, clientId: '', newClient: '', projectId: '', newProject: '', estNumber: '' }; }
function AddModal() {
  var k = G.ui.modal;
  var fs = useState(blankForm()), form = fs[0], setForm = fs[1];
  var sc = useState([]), scan = sc[0], setScan = sc[1];
  var fl = useState({ attach: [], estimate: null }), files = fl[0], setFiles = fl[1];
  var es = useState(''), err = es[0], setErr = es[1];
  var bs = useState(false), busy = bs[0], setBusy = bs[1];
  var ov = useState(false), over = ov[0], setOver = ov[1];
  var scanRef = useRef(scan); scanRef.current = scan;
  var go = function (m) { setForm(blankForm()); setScan([]); setFiles({ attach: [], estimate: null }); setErr(''); setUi({ modal: m }); };

  function acctDefault(q) { if (q.acctEdit != null) return q.acctEdit; var t = q.text || {}; if (t.account) return t.account; var b = benByPib(q.tin); return b && b.account ? b.account : ''; }
  function acctSrc(q) { if (q.acctEdit != null) return 'edited'; if ((q.text || {}).account) return 'read from the invoice'; var b = benByPib(q.tin); return b && b.account ? 'from the beneficiary archive' : 'not found on the invoice'; }

  function errors() {
    var e = [], amt = parseNum(form.amount);
    if (k === 'invoice') {
      if (!scan.length) e.push('at least one invoice file');
      if (scan.some(function (x) { return x.status === 'reading'; })) e.push('wait for QR reading to finish');
      if (!G.assets) e.push('edit access to upload files (ask the owner)');
    }
    if (k === 'refund') { if (!form.beneficiary.trim()) e.push('beneficiary name and surname'); if (!form.reason.trim()) e.push('reason for refund'); }

  }

  async function submit() {

    try {

      var pq = nextPq(), created = [];
      if (k === 'invoice') {
        var seen = Object.assign({}, inQueue);
        for (var i = 0; i < scan.length; i++) {

            if (draftOk(s.manual)) {

              it = Object.assign({}, common, mf.iso ? { iso: mf.iso, date: mf.date } : {}, { kind: 'invoice', manual: true, supplierSrc: 'manual', title: mf.name, pib: mf.pib, address: mf.address, account: mf.account ? acctNorm(mf.account) : '', bank: acctOk(mf.account) ? bankName(mf.account) : '', acctConfirmed: acctOk(mf.account) && !acctValid(mf.account), number: mf.number || 'Manual entry', amount: mf.amount, lineItems: mf.items });

          })}
        </div>`}

        ${isReq && html`<div class="stack">
          <${Field} label="Beneficiary archive" hint=${G.data.bens.length ? G.data.bens.length + ' saved by the team. Choosing one fills in the payment details.' : 'Nobody saved yet. Beneficiaries are saved here automatically when you submit, and everyone can choose them next time.'}>

              <option value="">+ New beneficiary</option>${G.data.bens.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (b) { return html`<option value=${b.id}>${b.name} · ${b.account || b.iban || (b.pib ? 'PIB ' + b.pib : 'no account')}</option>`; })}
            </select><//>

            <div class="row">
              <label class=${'seg' + (form.payType === 'domestic' ? ' on' : '')}><input type="radio" name="pt" checked=${form.payType === 'domestic'} onChange=${function () { setForm(Object.assign({}, form, { payType: 'domestic' })); }} /> Domestic</label>
              <label class=${'seg' + (form.payType !== 'domestic' ? ' on' : '')}><input type="radio" name="pt" checked=${form.payType !== 'domestic'} onChange=${function () { setForm(Object.assign({}, form, { payType: 'international' })); }} /> International</label>
            </div>
            ${form.payType === 'domestic' ? html`<${Field} label="Domestic account number" hint=${form.account ? acctHint(form.account, '') : ''}><input onBlur=${function (e) { if (acctOk(e.target.value)) setForm(Object.assign({}, form, { account: acctNorm(e.target.value) })); }} id="rq-acct" class="inp" inputmode="numeric" placeholder="e.g. 530-0000000000000-00" value=${form.account} onInput=${on('account')} /><//>`
              : html`<div class="grid"><${Field} label="IBAN"><input id="rq-iban" class="inp" value=${form.iban} onInput=${on('iban')} /><//><${Field} label="SWIFT / BIC"><input id="rq-swift" class="inp" value=${form.swift} onInput=${on('swift')} /><//></div>`}
          </fieldset>
          ${k === 'refund' && html`<${Field} label="Reason for refund" req><textarea id="rq-reason" class="inp" rows="3" value=${form.reason} onInput=${on('reason')}></textarea><//>`}
          ${k === 'contract' && html`<${Field} label="Purpose of payment"><input id="rq-purpose" class="inp" value=${form.purpose} onInput=${on('purpose')} /><//>`}
          <div class="grid">
            <${Field} label="Amount (EUR)" req><input id="rq-amt" class="inp num" inputmode="decimal" placeholder="0,00" value=${form.amount} onInput=${on('amount')} /><//>
            ${k === 'contract' && html`<${Field} label="JMBG / PIB"><input id="rq-jmbg" class="inp" inputmode="numeric" value=${form.jmbg} onInput=${on('jmbg')} /><//>`}
          </div>
          ${k === 'contract' && html`<${Field} label="Payment reference"><input id="rq-ref" class="inp" value=${form.payRef} onInput=${on('payRef')} /><//>
            <div class="row" style="align-items: flex-end"><div style="flex: 1 1 260px"><${Field} label="Legal reference (contract, decision)" req><input id="rq-legal" class="inp" placeholder="Contract or decision number" value=${form.legalRef} onInput=${on('legalRef')} /><//></div>
              <button class="btn o" onClick=${function () { var n = G.data.items.filter(function (x) { return x.kind === 'contract'; }).length + 1; setForm(Object.assign({}, form, { legalRef: 'DEC-' + new Date().getFullYear() + '-' + pad(n, 3), legalAuto: true })); }}>Generate automatically</button></div>
            ${form.legalAuto && html`<div style="margin-top: -8px; font-size: 12px; color: var(--ink-2)">Auto-generated reference, numbered from the contract payments already in the queue.</div>`}`}
          <div class="stack" style="gap: 8px">
            <label class="btn q" style="align-self: flex-start; cursor: pointer">${I.clip} ${k === 'contract' ? 'Attach contract or decision' : 'Attach documents'}<input id="rq-att" class="sr" type="file" multiple onChange=${function (e) { setFiles(Object.assign({}, files, { attach: files.attach.concat(Array.prototype.slice.call(e.target.files || [])) })); e.target.value = ''; }} /></label>
            ${files.attach.map(function (f, i) { return html`<div key=${i} class="filebox row" style="font-size: 13px"><span style="flex-grow: 1; word-break: break-all">${f.name}</span><button class="icon" aria-label=${'Remove ' + f.name} onClick=${function () { setFiles(Object.assign({}, files, { attach: files.attach.filter(function (_, j) { return j !== i; }) })); }}>${I.x}</button></div>`; })}
          </div>
          <label class="row" style="min-height: 44px; gap: 10px"><input class="ck" type="checkbox" checked=${form.saveBen} onChange=${function () { setForm(Object.assign({}, form, { saveBen: !form.saveBen })); }} /> ${form.benId ? 'Update this beneficiary in the archive' : 'Save this beneficiary to the archive'}</label>
        </div>`}

        ${k && k !== 'choose' && html`<fieldset class="card stack" style="margin: 0; padding: 16px">
          <legend style="padding: 0 6px; font-weight: 600">Link to client, project or cost estimate <span class="muted" style="font-weight: 400">· optional, leave empty to skip</span></legend>

            <div class="stack" style="gap: 8px">
              <${Field} label="Client"><select id="ln-client" class="inp" value=${form.clientId} onChange=${function (e) { setForm(Object.assign({}, form, { clientId: e.target.value, projectId: '', newProject: '' })); }}><option value="">No client</option>${G.data.clients.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (c) { return html`<option value=${c.id}>${c.name}</option>`; })}<option value="__new">+ Add new client</option></select><//>
              ${form.clientId === '__new' && html`<${Field} label="New client name" req><input id="ln-newc" class="inp" value=${form.newClient} onInput=${on('newClient')} /><//>`}
            </div>
            <div class="stack" style="gap: 8px">
              <${Field} label=${html`Project ${!form.clientId ? html`<span class="muted" style="font-weight: 400">· choose a client first</span>` : ''}`}><select id="ln-project" class="inp" disabled=${!form.clientId} value=${form.projectId} onChange=${on('projectId')}><option value="">No project</option>${projects.map(function (p) { return html`<option value=${p.id}>${p.name}</option>`; })}<option value="__new">+ Add new project</option></select><//>
              ${form.projectId === '__new' && html`<${Field} label="New project name" req><input id="ln-newp" class="inp" value=${form.newProject} onInput=${on('newProject')} /><//>`}
            </div>
          </div>

            <div style="flex: 1 1 220px"><${Field} label="Cost estimate number"><input id="ln-ce" class="inp" value=${form.estNumber} onInput=${on('estNumber')} /><//></div>
            <label class="btn q" style="cursor: pointer">${I.dl} Upload cost estimate${form.estNumber.trim() ? html` <span class="req">*</span>` : ''}<input id="ln-cefile" class="sr" type="file" onChange=${function (e) { setFiles(Object.assign({}, files, { estimate: (e.target.files || [])[0] || null })); }} /></label>
          </div>
          ${files.estimate && html`<div class="filebox" style="font-size: 13px">${files.estimate.name}</div>`}
        </fieldset>`}
        ${err && html`<div class="alert e" role="alert">${err}</div>`}
      </div>
      ${k && k !== 'choose' && html`<div class="mfoot"><button class="btn q" disabled=${busy} onClick=${function () { go('choose'); }}>Back</button><button class="btn" disabled=${busy} onClick=${submit}>${busy ? 'Saving…' : 'Add to payment queue'}</button></div>`}
    </div></div>`;
}

// ================= USERS =================
function Users() {
  var me = G.me, role = me.role, top = isTop(role), roles = creatable(role);
  var ns = useState({ first: '', last: '', position: '', email: '', role: roles[roles.length > 2 ? 2 : 0] || 'aa', pass: '', err: '' }), nu = ns[0], setNu = ns[1];
  var rr = useState({}), regRole = rr[0], setRegRole = rr[1];
  var ams = G.data.users.filter(function (u) { return u.role === 'am' && u.active !== false; });
  var ls = useState(null), linkBox = ls[0], setLinkBox = ls[1];
  function linkResult(r, email, kind) {
    if (r.emailed) { toast({ invite: 'Invitation emailed to ', reset: 'Password reset link emailed to ', welcome: 'Account created. Welcome email sent to ' }[kind] + email + '.'); setLinkBox(null); }
    else if (r.link) setLinkBox({ email: email, link: r.link, kind: kind, why: (r.emailError || 'Email is not set up yet').replace(/\.+$/, '') });
    else toast('Account created for ' + email + '.');
  }
  async function sendLink(u) {
    try { var r = await window.daa.post('/api/users/invite', { id: u.id }); linkResult(r, u.email, r.kind); } catch (ex) { toast(ex.message, true); }
  }
  async function approve(r) {
    var rl = regRole[r.id] || r.role || 'aa';
    if (roles.indexOf(rl) < 0) rl = 'aa';
    try { await window.daa.post('/api/regs/approve', { id: r.id, role: rl }); toast(r.first + ' ' + r.last + ' can now sign in as ' + ROLE[rl] + '.'); }
    catch (ex) { toast(ex.message, true); }
  }
  async function create(e) {
    e.preventDefault();
    var em = nu.email.trim().toLowerCase();
    if (!nu.first.trim() || !nu.last.trim() || !nu.position.trim()) { setNu(Object.assign({}, nu, { err: 'Add first name, last name and position.' })); return; }
    if (!/@daa\.co\.me$/.test(em)) { setNu(Object.assign({}, nu, { err: 'Use a @daa.co.me email address.' })); return; }
    if (G.data.users.some(function (u) { return (u.email || '').toLowerCase() === em; })) { setNu(Object.assign({}, nu, { err: 'An account with this email already exists.' })); return; }
    if (nu.pass && nu.pass.length < 8) { setNu(Object.assign({}, nu, { err: 'A starting password needs at least 8 characters, or leave it empty to send an invitation.' })); return; }
    var rl = roles.indexOf(nu.role) >= 0 ? nu.role : roles[0];
    try {
      var cr = await window.daa.post('/api/users/create', { first: nu.first, last: nu.last, position: nu.position, email: em, role: rl, managerId: nu.managerId || '', pass: nu.pass });
      linkResult(cr, em, nu.pass ? 'welcome' : 'invite'); setNu({ first: '', last: '', position: '', email: '', role: rl, pass: '', err: '' });
    } catch (ex) { setNu(Object.assign({}, nu, { err: ex.message })); }
  }
  var matrix = [['See all payment requests', [1, 1, 0, 0, 1]], ['See their assistants\u2019 requests', [1, 1, 1, 0, 1]], ['Add invoices and payment requests', [1, 1, 1, 1, 1]], ['Approve document', [1, 1, 1, 0, 0]], ['Deny with reason', [1, 1, 1, 0, 0]], ['Approve for payment', [1, 1, 0, 0, 0]], ['Send to payment', [1, 1, 0, 0, 0]], ['Receive payments to execute', [0, 0, 0, 0, 1]], ['Mark as paid', [1, 1, 0, 0, 1]], ['Approve access requests', [1, 1, 1, 0, 0]], ['Create accounts', ['All', 'All', 'Assistants', 0, 0]], ['Change roles, deactivate', [1, 1, 0, 0, 0]]];
  return html`<main class="page wrap gut">
    ${top && html`<${AnnounceAdmin} />`}
    <section class="card" aria-label="Access requests" style="overflow: hidden">
      <div class="pad" style="border-bottom: 1px solid var(--line)"><h2 style="font-size: 17px">Access requests</h2><div class="muted" style="font-size: 13px">People who asked for access from the sign-in screen.</div></div>
      ${G.data.regs.length ? G.data.regs.map(function (r) { return html`<div key=${r.id} class="row pad" style="border-bottom: 1px solid var(--line-2); gap: 10px 16px">
        <div style="flex: 1 1 240px; min-width: 0"><b>${r.first} ${r.last}</b> <span class="muted">· ${r.position}</span><div class="muted" style="font-size: 12px">${r.email} · to confirm: ${r.approver} · ${r.time}</div></div>
        <label class="row" style="font-size: 13px">Role <select class="inp" style="width: auto" value=${regRole[r.id] || r.role || 'aa'} onChange=${function (e) { var p = Object.assign({}, regRole); p[r.id] = e.target.value; setRegRole(p); }}>${roles.map(function (x) { return html`<option value=${x}>${ROLE[x]}</option>`; })}</select></label>
        <button class="btn" onClick=${function () { approve(r); }}>Approve</button><button class="btn do" onClick=${function () { del('regs', r.id).then(function (ok) { if (ok) logEv('users', 'Denied access request from ' + r.first + ' ' + r.last + ' (' + r.email + ')'); }); }}>Deny</button>
      </div>`; }) : html`<div class="pad muted">No pending requests.</div>`}
    </section>
    <div class="row" style="align-items: flex-start; gap: 24px">
      <section class="card" aria-label="Team" style="flex: 1 1 480px; min-width: 0; overflow: hidden">
        <div class="pad" style="border-bottom: 1px solid var(--line)"><h2 style="font-size: 17px">Team</h2><div class="muted" style="font-size: 13px">${top ? 'You can create any account, change roles and deactivate people.' : 'You can create account assistant accounts.'}</div></div>
        ${G.data.users.slice().sort(function (a, b) { return nameOf(a).localeCompare(nameOf(b)); }).map(function (u) {
          var ed = top && u.id !== me.id;
          return html`<div key=${u.id} class="row pad" style="border-bottom: 1px solid var(--line-2); padding-block: 12px; ${u.active === false ? 'opacity: 0.6' : ''}">
            <span class="av l" aria-hidden="true">${initials(u)}</span>
            <div style="flex: 1 1 200px; min-width: 0"><b>${nameOf(u)}</b>${u.active === false ? html` <span class="badge s5">Deactivated</span>` : ''}${u.pending ? html` <span class="badge s1">Invitation pending</span>` : ''}<div class="muted" style="font-size: 12px; word-break: break-all">${u.position} · ${u.email}${has2fa(u) ? ' · 2-step on' : needs2fa(u) ? ' · 2-step pending' : ''}</div></div>
            ${u.id !== me.id && u.active !== false && (top || (role === 'am' && u.role === 'aa')) && html`<button class="btn q sm" onClick=${function () { sendLink(u); }}>${u.pending ? 'Send invitation again' : 'Send password reset'}</button>`}
            ${top && u.id !== me.id && has2fa(u) && html`<button class="btn q sm" onClick=${function () { patch('users', u.id, { totp: { on: false, secret: '' } }).then(function (r) { if (r) { logEv('security', 'Reset two-step sign-in for ' + nameOf(u)); toast('Two-step sign-in reset for ' + nameOf(u) + '. They set it up again at next sign-in.'); } }); }}>Reset 2-step</button>`}
            ${u.role === 'aa' && html`<label class="row" style="font-size: 13px; gap: 6px">Manager ${top ? html`<select class="inp" style="width: auto" aria-label=${'Account manager for ' + nameOf(u)} value=${u.managerId || ''} onChange=${function (e) { patch('users', u.id, { managerId: e.target.value }); }}><option value="">Not assigned</option>${ams.map(function (m) { return html`<option value=${m.id}>${nameOf(m)}</option>`; })}</select>` : html`<b>${u.managerId ? userName(u.managerId) : 'Not assigned'}</b>`}</label>`}
            ${ed ? html`<select class="inp" style="width: auto" aria-label=${'Role for ' + nameOf(u)} value=${u.role} onChange=${function (e) { var v = e.target.value; patch('users', u.id, { role: v }).then(function (r) { if (r) logEv('users', 'Role of ' + nameOf(u) + ' changed to ' + ROLE[v]); }); }}>${roles.map(function (x) { return html`<option value=${x}>${ROLE[x]}</option>`; })}</select>
              <button class="btn q sm" onClick=${function () { var on = u.active === false; patch('users', u.id, { active: on }).then(function (r) { if (r) logEv('users', (on ? 'Reactivated ' : 'Deactivated ') + nameOf(u)); }); }}>${u.active === false ? 'Reactivate' : 'Deactivate'}</button>` : html`<span class="badge s0">${ROLE[u.role]}</span>`}
          </div>`;
        })}
        ${roles.length > 0 && html`<form class="stack pad" style="background: var(--bg)" onSubmit=${create}>
          <b>Create account</b>
          <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px">
            <${Field} label="First name"><input id="nu-first" class="inp" value=${nu.first} onInput=${inputOn(nu, setNu, 'first')} /><//>
            <${Field} label="Last name"><input id="nu-last" class="inp" value=${nu.last} onInput=${inputOn(nu, setNu, 'last')} /><//>
            <${Field} label="Position"><input id="nu-pos" class="inp" value=${nu.position} onInput=${inputOn(nu, setNu, 'position')} /><//>
            <${Field} label="Email"><input id="nu-email" class="inp" type="email" placeholder="name@daa.co.me" value=${nu.email} onInput=${inputOn(nu, setNu, 'email')} /><//>
            <${Field} label="Role"><select id="nu-role" class="inp" value=${nu.role} onChange=${inputOn(nu, setNu, 'role')}>${roles.map(function (x) { return html`<option value=${x}>${ROLE[x]}</option>`; })}</select><//>
            ${top && nu.role === 'aa' && html`<${Field} label="Account manager"><select id="nu-mgr" class="inp" value=${nu.managerId || ''} onChange=${inputOn(nu, setNu, 'managerId')}><option value="">Not assigned</option>${ams.map(function (m) { return html`<option value=${m.id}>${nameOf(m)}</option>`; })}</select><//>`}
            <${Field} label="Starting password (optional)" hint="Leave empty to email an invitation link; they choose their own password."><input id="nu-pass" class="inp" type="text" autocomplete="off" value=${nu.pass} onInput=${inputOn(nu, setNu, 'pass')} /><//>
          </div>
          ${nu.err && html`<div class="alert e" role="alert">${nu.err}</div>`}
          <button class="btn" type="submit" style="align-self: flex-start">Create account</button>
        </form>`}
      </section>
      <section class="card" aria-label="Permissions" style="flex: 1 1 600px; min-width: 0; overflow: hidden">
        <div class="pad" style="border-bottom: 1px solid var(--line)"><h2 style="font-size: 17px">What each role can do</h2></div>
        <div class="scroll"><table class="t" style="min-width: 640px"><thead><tr><th style="padding: 10px 20px">Action</th>${['Super-admin', 'CEO', 'Account manager', 'Account assistant', 'Office manager'].map(function (r) { return html`<th style="text-align: center">${r}</th>`; })}</tr></thead>
          <tbody>${matrix.map(function (m) { return html`<tr><th scope="row" style="background: none; padding: 11px 20px; font-weight: 500; white-space: normal">${m[0]}</th>${m[1].map(function (v) { return html`<td style=${'text-align: center;' + (v ? ' font-weight: 700' : ' color: var(--muted)')}>${v === 1 ? 'Yes' : (v || '—')}</td>`; })}</tr>`; })}</tbody></table></div>
        <p class="muted" style="margin: 0; padding: 14px 20px; font-size: 12px; border-top: 1px solid var(--line-2)">Account managers see their own requests and their assistants’; assistants see only their own. Assistants with no manager assigned are visible to every account manager. The office manager, CEO and Super-admin see all requests.</p>
      </section>
    </div>
    ${linkBox && html`<div class="alert i stack" role="status" style="gap: 8px"><span><b>${linkBox.why}.</b> Send this ${linkBox.kind === 'reset' ? 'password reset' : 'invitation'} link to ${linkBox.email} yourself (it works for ${linkBox.kind === 'reset' ? '24 hours' : '7 days'}):</span><span class="mono" style="word-break: break-all; user-select: all; font-size: 13px">${linkBox.link}</span><div class="row"><button class="btn sm" onClick=${function () { try { navigator.clipboard.writeText(linkBox.link).then(function () { toast('Link copied.'); }); } catch (e) {} }}>Copy link</button><button class="btn q sm" onClick=${function () { setLinkBox(null); }}>Done</button></div></div>`}
    ${top && html`<${BugReports} />`}
    ${top && html`<${ActivityLog} />`}
    ${top && html`<${Backups} />`}
  </main>`;
}

// ================= BENEFICIARIES =================
function benUses(b) {
  var nm = (b.name || '').toLowerCase();

}
function Beneficiaries() {

  }).sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
  function open(b) { setDel(null); setEd(b ? { id: b.id, name: b.name || '', pib: b.pib || '', account: b.account || '', address: b.address || '', err: '' } : { id: null, name: '', pib: '', account: '', address: '', err: '' }); }

    e.preventDefault();

    if (pib && G.data.bens.some(function (b) { return b.pib === pib && b.id !== ed.id; })) return fail('Another beneficiary already has PIB ' + pib + '.');
    if (acc && !acctOk(acc)) return fail('Use the format 5XX-XXXXXXXXXXXXX-XX for the account number.');

    var ok = ed.id ? await patch('bens', ed.id, data) : await put('bens', uid('b'), Object.assign({ iban: '', swift: '', jmbg: pib, createdAt: stamp(), createdBy: me.id }, data));
    if (ok) { toast(ed.id ? 'Saved ' + name + '.' : 'Added ' + name + '.'); logEv('data', (ed.id ? 'Edited beneficiary ' : 'Added beneficiary ') + name + (pib ? ' (PIB ' + pib + ')' : '')); setEd(null); }

      <${Field} label="Address" wide><input id="bn-adr" class="inp" value=${ed.address} onInput=${inputOn(ed, setEd, 'address')} /><//>
    </div>
    ${ed.err && html`<div class="alert e" role="alert">${ed.err}</div>`}
    <div class="row"><button class="btn" type="submit">${ed.id ? 'Save changes' : 'Add beneficiary'}</button><button class="btn q" type="button" onClick=${function () { setEd(null); }}>Cancel</button></div>
  </form>`;

    <section class="card pad row" style="justify-content: space-between; gap: 12px" aria-label="Beneficiaries">

        <label style="flex: 1 1 220px; max-width: 360px"><span class="sr">Search beneficiaries</span><input id="bn-q" class="inp" type="search" placeholder="Search name, PIB, account, address" value=${q} onInput=${function (e) { setQ(e.target.value); }} /></label>

    ${narrow ? html`<section class="mlist" aria-label="Beneficiary list">${list.map(function (b) {
        var ok = !b.account || acctValid(b.account);
        return html`<article key=${b.id} class=${'mcard' + (ed && ed.id === b.id ? ' sel' : '')}>

          ${b.address && html`<div class="mmeta">${b.address}</div>`}

            <td class="mono">${b.pib || '—'}</td>
            <td>${b.account ? html`<span class="mono">${b.account}</span><div class="muted" style="font-size: 12px">${b.bank || bankName(b.account)}${ok ? '' : ' · control digits differ from the usual check'}</div>` : (b.iban ? html`<span class="mono">${b.iban}</span><div class="muted" style="font-size: 12px">IBAN${b.swift ? ' · ' + b.swift : ''}</div>` : html`<span class="muted">—</span>`)}</td>

}

function Profile() {
  var me = G.me, s = useState({ first: me.first || '', last: me.last || '', position: me.position || '', cur: '', p1: '', p2: '', msg: '', ok: true }), f = s[0], set = s[1];
  var ts = useState(false), setup = ts[0], setSetup = ts[1];

  async function save(e) {
    e.preventDefault();
    var p = { first: f.first.trim(), last: f.last.trim(), position: f.position.trim() };
    if (f.p1 || f.p2) {
      if (f.p1.length < 8) { set(Object.assign({}, f, { msg: 'The new password needs at least 8 characters.', ok: false })); return; }
      if (f.p1 !== f.p2) { set(Object.assign({}, f, { msg: 'The two new passwords do not match.', ok: false })); return; }
      try { await window.daa.post('/api/password', { cur: f.cur, next: f.p1 }); p.pw = true; }
      catch (ex) { set(Object.assign({}, f, { msg: ex.message, ok: false })); return; }
    }
    var pwChanged = !!p.pw; delete p.pw;
    if (await patch('users', me.id, p)) set(Object.assign({}, f, { cur: '', p1: '', p2: '', msg: pwChanged ? 'Saved. Your new password works from the next sign-in.' : 'Saved.', ok: true }));
  }
  return html`<div class="modal-wrap" onClick=${function (e) { if (e.target === e.currentTarget) close(); }}><div class="modal" style="max-width: 560px" role="dialog" aria-modal="true" aria-labelledby="pf-title">

      <${Field} label="Position"><input id="pf-pos" class="inp" value=${f.position} onInput=${inputOn(f, set, 'position')} /><//>
      <fieldset class="card grid" style="margin: 0; padding: 14px 16px"><legend style="padding: 0 6px; font-weight: 600">Change password</legend>
        <${Field} label="Current password"><input id="pf-cur" class="inp" type="password" autocomplete="current-password" value=${f.cur} onInput=${inputOn(f, set, 'cur')} /><//>
        <${Field} label="New password"><input id="pf-p1" class="inp" type="password" autocomplete="new-password" value=${f.p1} onInput=${inputOn(f, set, 'p1')} /><//>
        <${Field} label="Repeat new password"><input id="pf-p2" class="inp" type="password" autocomplete="new-password" value=${f.p2} onInput=${inputOn(f, set, 'p2')} /><//>
      </fieldset>
      ${f.msg && html`<div class=${'alert ' + (f.ok ? 'i' : 'e')} role="status">${f.msg}</div>`}
      <div class="row" style="justify-content: space-between"><button class="btn q" type="button" onClick=${signOut}>Sign out</button><button class="btn" type="submit">Save changes</button></div>
    </form>
    <div class="mbody" style="border-top: 1px solid var(--line-2)">
      <div class="row" style="justify-content: space-between"><div><b>Two-step sign-in</b><div class="muted" style="font-size: 13px">${has2fa(me) ? 'On since ' + (me.totp.at || '—') + '. You enter a code from your phone when you sign in.' : needs2fa(me) ? 'Required for your role. You will set it up at your next sign-in.' : 'Off. Turn it on for extra protection.'}</div></div>
        ${!has2fa(me) && !setup && html`<button class="btn o sm" onClick=${function () { setSetup(true); }}>Turn on</button>`}
        ${has2fa(me) && !needs2fa(me) && html`<button class="btn q sm" onClick=${function () { window.daa.post('/api/totp/disable').then(function () { toast('Two-step sign-in is off.'); }, function (e) { toast(e.message, true); }); }}>Turn off</button>`}
      </div>
      ${setup && !has2fa(me) && html`<${TotpSetup} user=${me} onDone=${function () { setSetup(false); toast('Two-step sign-in is on.'); }} onCancel=${function () { setSetup(false); }} />`}
    </div></div></div>`;
}

var LOGTYPES = { all: 'All activity', payment: 'Payments', edit: 'Edits', users: 'Users & access', security: 'Security', signin: 'Sign-ins', email: 'Emails', data: 'Beneficiaries & data' };
function History(p) {

function ActivityLog() {

      </div>

      ${!rows.length && html`<div class="empty">${G.data.log.length ? 'No activity matches.' : 'Nothing logged yet. Actions are logged from this version on.'}</div>`}
    </div>
  </section>`;
}
function Backups() {
  var ps = useState(null), pending = ps[0], setPending = ps[1];
  var bs = useState(''), busy = bs[0], setBusy = bs[1];
  async function download() {
    setBusy('dl');
    try {
      var out = await window.daa.get('/api/backup');
      await saveFile('DAA-Pay-backup-' + todayIso() + '.json', JSON.stringify(out, null, 1));
    } catch (e) { toast('Backup failed: ' + (e.message || e.code), true); }
    setBusy('');
  }
  function pick(e) {
    var file = (e.target.files || [])[0]; e.target.value = '';
    if (!file) return;
    file.text().then(function (t) {
      var j = JSON.parse(t);
      if (!j || j.app !== 'DAA Payment Queue' || !j.collections) throw new Error('This is not a DAA Pay backup file.');
      var counts = COLS.map(function (c) { return [c, Object.keys(j.collections[c] || {}).length]; }).filter(function (x) { return x[1]; });
      setPending({ data: j, counts: counts, name: file.name });
    }).catch(function (err) { toast(err.message || 'Could not read that file.', true); });
  }
  async function restore() {
    setBusy('rs');
    try { var r = await window.daa.post('/api/import', pending.data); toast('Restored ' + r.restored + ' records.'); setPending(null); }
    catch (ex) { toast(ex.message, true); }
    setBusy('');
  }
  return html`<section class="card pad stack" aria-label="Data and backups">
    <div><h2 style="font-size: 17px">Data & backups</h2><div class="muted" style="font-size: 13px">A backup holds every record: users, requests, beneficiaries, clients, projects, notifications and the activity log. Uploaded files stay in the app's file storage and are not inside the backup. Keep backup files private: they contain account numbers and password hashes.</div></div>
    <div class="row">
      <button class="btn" disabled=${!!busy} onClick=${download}>${I.dl} ${busy === 'dl' ? 'Preparing…' : 'Download backup'}</button>
      <label class="btn o" style="cursor: pointer">Restore from backup…<input class="sr" type="file" accept="application/json,.json" onChange=${pick} /></label>
    </div>
    ${pending && html`<div class="alert e stack" role="alertdialog" aria-label="Confirm restore" style="gap: 8px">
      <span><b>Restore ${pending.name}?</b> Records in the file overwrite records with the same ID (${pending.counts.map(function (x) { return x[1] + ' ' + x[0]; }).join(', ')}). Records that are not in the file are kept.</span>
      <div class="row"><button class="btn d" disabled=${!!busy} onClick=${restore}>${busy === 'rs' ? 'Restoring…' : 'Restore'}</button><button class="btn q" style="background: var(--surface)" onClick=${function () { setPending(null); }}>Cancel</button></div>
    </div>`}
    <div class="muted" style="font-size: 12px">The server also keeps a daily backup for 30 days.</div>
  </section>`;
}

  else body = html`<${Header} />${G.ui.tab === 'users' && (isTop(G.me.role) || G.me.role === 'am') ? html`<${Users} />` : G.ui.tab === 'bens' ? html`<${Beneficiaries} />` : html`<${Queue} />`}
    ${G.ui.open && html`<${Drawer} key=${G.ui.open} />`}${G.ui.modal && html`<${AddModal} key=${G.ui.modal} />`}${G.ui.profile && html`<${Profile} />`}`;
  return html`${G.err && html`<div class="alert e gut" role="alert" style="border-radius: 0">${G.err}</div>`}${body}${G.ui.privacy && html`<${Privacy} />`}${G.ui.help && html`<${HelpCenter} />`}${G.ui.install && html`<${InstallApp} />`}${G.ui.bug && html`<${ReportBug} />`}${G.ui.toast && html`<div class=${'toast' + (G.ui.toast.bad ? ' e' : '')} role="status">${G.ui.toast.text}</div>`}`;
