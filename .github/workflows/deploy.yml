name: Deploy DAA Pay

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::This workflow cannot see:$missing. Add them as repository secrets under Settings > Secrets and variables > Actions > Secrets tab > Repository secrets (not Variables, not an Environment)."
            exit 1
          fi
          echo "Both Cloudflare secrets are present (token ${#CLOUDFLARE_API_TOKEN} characters, account ID ${#CLOUDFLARE_ACCOUNT_ID} characters)."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Create database and file bucket on first run
        run: |
          set -o pipefail
          # Run a wrangler command; on failure show Cloudflare's message as an error annotation.
          w() { out=$(npx wrangler "$@" 2>&1); rc=$?; echo "$out"; if [ $rc -ne 0 ]; then echo "::error title=wrangler $1 $2::$(echo "$out" | grep -v '^\s*$' | tail -6 | tr '\n' ' ' | cut -c1-900)"; fi; return $rc; }
          findid() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=s.slice(s.indexOf("["));const l=JSON.parse(j);const d=l.find(x=>x.name==="daa-pay");process.stdout.write(d?(d.uuid||d.id||""):"")})'; }
          w d1 list --json || exit 1
          ID=$(npx wrangler d1 list --json 2>/dev/null | findid)
          if [ -z "$ID" ]; then
            w d1 create daa-pay --location weur || exit 1
            ID=$(npx wrangler d1 list --json 2>/dev/null | findid)
          fi
          [ -n "$ID" ] || { echo "::error::The daa-pay database could not be found after creating it."; exit 1; }
          echo "D1 database: $ID"
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          # The token may not have R2 rights; then the bucket must already exist (created in the dashboard).
          if npx wrangler r2 bucket list > r2.txt 2>&1; then
            grep -q "daa-pay-files" r2.txt || w r2 bucket create daa-pay-files --location weur || exit 1
          else
            echo "::warning::The API token cannot list R2 buckets. Using the existing bucket 'daa-pay-files'."
          fi

      - name: Apply database migrations
        run: |
          out=$(npx wrangler d1 migrations apply daa-pay --remote 2>&1); rc=$?; echo "$out"
          [ $rc -eq 0 ] || { echo "::error title=migrations::$(echo "$out" | grep -v '^\s*$' | tail -6 | tr '\n' ' ' | cut -c1-900)"; exit 1; }

      - name: Deploy
        run: |
          out=$(npx wrangler deploy 2>&1); rc=$?; echo "$out"
          [ $rc -eq 0 ] || { echo "::error title=deploy::$(echo "$out" | grep -v '^\s*$' | tail -8 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          echo "::notice title=DAA Pay is live::${url:-see the deploy log for the address}"

      - name: Fiscal certificate (if provided)
        env:
          FISCAL_CERT_P12: ${{ secrets.FISCAL_CERT_P12 }}
          FISCAL_CERT_PASSWORD: ${{ secrets.FISCAL_CERT_PASSWORD }}
        run: |
          # Never prints the key or password. Converts the .p12 for the Worker and checks it against a
          # known fiscalized invoice: the IKOF of DAA's invoice 205/2026 must come out the same.
          if [ -z "$FISCAL_CERT_P12" ] || [ -z "$FISCAL_CERT_PASSWORD" ]; then
            echo "::warning title=Fiscal certificate::Not found. Add FISCAL_CERT_P12 (the .p12 file as base64) and FISCAL_CERT_PASSWORD as repository secrets."; exit 0; fi
          echo "::add-mask::$FISCAL_CERT_PASSWORD"
          d=$(mktemp -d); trap 'rm -rf "$d"' EXIT; chmod 700 "$d"
          printf '%s' "$FISCAL_CERT_P12" | tr -d ' \r\n' | base64 -d > "$d/c.p12" 2>/dev/null || { echo "::error title=Fiscal certificate::FISCAL_CERT_P12 is not valid base64."; exit 0; }
          p12() { openssl pkcs12 -in "$d/c.p12" -passin env:FISCAL_CERT_PASSWORD "$@" 2>/dev/null || openssl pkcs12 -legacy -in "$d/c.p12" -passin env:FISCAL_CERT_PASSWORD "$@" 2>/dev/null; }
          p12 -nocerts -nodes -out "$d/k.pem" && p12 -clcerts -nokeys -out "$d/c.pem" || { echo "::error title=Fiscal certificate::Could not open the .p12 file. Check FISCAL_CERT_PASSWORD and that FISCAL_CERT_P12 is the whole file in base64."; exit 0; }
          openssl pkcs8 -topk8 -nocrypt -in "$d/k.pem" -out "$d/k8.pem" 2>/dev/null || cp "$d/k.pem" "$d/k8.pem"
          subj=$(openssl x509 -in "$d/c.pem" -noout -subject | sed 's/^subject=//'); until=$(openssl x509 -in "$d/c.pem" -noout -enddate | cut -d= -f2)
          match=""
          for s in "02764318|2026-11-08T21:16:17+01:00|205|ta408js210|qs766qf990|qk433mq872|506.04" "02764318|2026-11-08T21:16:17+01:00|205|ta408js210|qs766qf990|qk433mq872|506.040"; do
            ikof=$(printf '%s' "$s" | openssl dgst -sha256 -sign "$d/k8.pem" | openssl dgst -md5 -r | cut -d' ' -f1)
            [ "$ikof" = "b75ea584a8d76231d2b91ef41cbf98dd" ] && match="$s"
          done
          if [ -n "$match" ]; then echo "::notice title=Fiscal certificate OK::$subj, valid until $until. IKOF of invoice 205/2026 recalculated exactly (format: ${match##*|})."
          else echo "::warning title=Fiscal certificate::Opened ($subj, valid until $until), but the IKOF of invoice 205/2026 did not come out the same. Fiscalization stays off until this is solved."; fi
          npx wrangler secret put FISCAL_KEY_PEM < "$d/k8.pem" > /dev/null && npx wrangler secret put FISCAL_CERT_PEM < "$d/c.pem" > /dev/null && echo "Certificate stored for the Worker."

      - name: Store email key (if provided)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY not set: the app runs, but emails are switched off until it is added."
          fi
