name: Deploy DAA Pay

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::This workflow cannot see:$missing. Add them as repository secrets under Settings > Secrets and variables > Actions > Secrets tab > Repository secrets (not Variables, not an Environment)."
            exit 1
          fi
          echo "Both Cloudflare secrets are present (token ${#CLOUDFLARE_API_TOKEN} characters, account ID ${#CLOUDFLARE_ACCOUNT_ID} characters)."

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Create database and file bucket on first run
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="daa-pay");process.stdout.write(d?(d.uuid||d.id||""):"")})')
          if [ -z "$ID" ]; then
            npx wrangler d1 create daa-pay --location weur
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="daa-pay");process.stdout.write(d?(d.uuid||d.id||""):"")})')
          fi
          echo "D1 database: $ID"
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          # The token may not have R2 rights; then the bucket must already exist (created in the dashboard).
          if npx wrangler r2 bucket list > r2.txt 2>&1; then
            grep -q "daa-pay-files" r2.txt || npx wrangler r2 bucket create daa-pay-files --location weur
          else
            echo "::warning::The API token cannot manage R2. Using the existing bucket 'daa-pay-files' (create it in the Cloudflare dashboard if it is missing)."
          fi

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply daa-pay --remote

      - name: Deploy
        run: npx wrangler deploy

      - name: Store email key (if provided)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY not set: the app runs, but emails are switched off until it is added."
          fi
